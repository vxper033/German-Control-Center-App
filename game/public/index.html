<!DOCTYPE html>
<html lang="en-US" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>German Control Center</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""></script>
</head>
<body>
    <div class="tab" id="Map">
        <h2>Map</h2>
        <div id="leafmap"></div>
    </div>
    <div class="tab" id="Buildings" hidden>
    <h2>Buildings</h2>

    <!-- Liste gebaute Gebäude -->
    <div id="BuildingList" class="building-list">
    </div>

    <!-- Button unterhalb der Liste -->
    <div class="building-actions">
        <button id="NewBuildingBtn" class="building-button">
            + Neues Gebäude bauen
        </button>
    </div>

    <!-- Bauformular oder so -->
    <div id="BuildingModal" class="building-modal" hidden>
        <div class="building-modal-content">
            <h3>Neues Gebäude bauen</h3>

            <label for="BuildingType">Gebäudetyp</label>
            <select id="BuildingType">
                <option value="fire_station">Feuerwache</option>
                <option value="police_station">Polizeiwache</option>
                <option value="rescue_station">Rettungswache</option>
                <option value="thw_station">THW-Ortsverband</option>
                <option value="control_center">Leitstelle</option>
            </select>

            <label for="BuildingName">Gebäudename</label>
            <input
                type="text"
                id="BuildingName"
                placeholder="z. B. Feuerwache 1"
                maxlength="50"
            >

            <div class="building-modal-actions">
                <button id="ConfirmBuildingBtn" class="building-button">
                    Gebäude errichten
                </button>

                <button id="CancelBuildingBtn" class="building-cancel">
                    Abbrechen
                </button>
            </div>
        </div>
    </div>
</div>
    <div class="tab" id="Callouts" hidden>
        <h2>Callouts</h2>
    </div>
    <div class="tab" id="Settings" hidden>
        <h2>Settings</h2>
        <label id="DarkModeText"><input type="checkbox" id="DarkModeCheck" checked>Dark Mode</label>
    </div>
    <footer class="footer">
        <button class="navbutton" id="NavMapBtn">Map</button>
        <button class="navbutton" id="NavBuildingsBtn">Buildings</button>
        <button class="navbutton" id="NavCalloutsBtn">Callouts</button>
        <button class="navbutton" id="NavSettingsBtn">Settings</button>
        <button class="navbutton" id="SoonBtn">Cumming soon</button>
    </footer>
    <script src="js/app.js "></script>
</body>
</html>
